version: '3.8'

services:
  # API Backend (from GitHub Container Registry)
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:${IMAGE_TAG:-latest}
    container_name: keuzekompas-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # Only bind to localhost, use reverse proxy
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - SALT_ROUNDS=${SALT_ROUNDS:-12}
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - keuzekompas-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend (from GitHub Container Registry)
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${IMAGE_TAG:-latest}
    container_name: keuzekompas-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"  # Bind to localhost, use reverse proxy
    depends_on:
      - api
    environment:
      - NGINX_HOST=${DOMAIN_NAME:-localhost}
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - keuzekompas-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (Optional but recommended)
  nginx:
    image: nginx:alpine
    container_name: keuzekompas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /home/damian/dev/keuzekompas/nginx-http.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - api
    networks:
      - keuzekompas-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Watchtower for automatic updates (Optional)
  watchtower:
    image: containrrr/watchtower
    container_name: keuzekompas-watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300  # Check for updates every 5 minutes
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_LABEL_ENABLE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - keuzekompas-network

volumes:
  nginx_logs:
    driver: local

networks:
  keuzekompas-network:
    driver: bridge
